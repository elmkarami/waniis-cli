version: "2"
linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*github.com/xuri/excelize/v2.File).Close
        - (net.Conn).Close
        - (*net/http.Response).Body.Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
formatters:
  enable:
    - gofmt
