name: Release

on:
  push:
    tags: ["v*"]
  # A release from the Actions tab (or the API): the job creates the tag on the chosen branch
  # itself, then releases it. A tag pushed by this workflow's token starts no second run.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write # create the GitHub release
  id-token: write # keyless cosign signing (OIDC)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag (manual releases)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The version must look like v1.2.3 (or v1.2.3-rc.1)."; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION already exists."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "waniis $VERSION"
          git push origin "$VERSION"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # The version's section, from its heading to the next one, without the heading.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION. Add \"## $VERSION — <date>\" first."; exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          # Publishes the release and its archives to this repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Homebrew formula goes to a different repository (elmkarami/homebrew-tap), which
          # GITHUB_TOKEN can't write to: this is a separate secret holding a fine-grained token
          # with Contents: read and write on the tap only. Create the tap repo and the secret
          # before the first tag.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
